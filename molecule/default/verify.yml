---
- name: Verify
  hosts: all
  vars:
    expected_packages:
      - stolon
      - wal-g-pg
      - etcd
      - "{{ pg_server_package[ansible_facts.pkg_mgr] }}"
      - minio
      - keepalived
      - haproxy
      - pgroute66
      - sysstat
    # PostgreSQL server package and repositories to check, per package manager
    pg_server_package:
      dnf: postgresql17-server
      zypper: postgresql17-server
      apt: postgresql-17
    repo_check:
      dnf:
        command: dnf repolist --enabled
        expect: [PgVillage, pgdg-common, pgdg17]
      zypper:
        command: zypper --non-interactive repos
        expect: [PgVillage, pgdg-common, pgdg17]
      apt:
        command: apt-cache policy
        expect: [repo.pgvillage.org/apt/stable, apt.postgresql.org]
    expected_users: [postgres, pgbouncer, avchecker, pgquartz, pgfga, pgroute66, minio, haproxy, keepalived]
  tasks:
    - name: Read the installed packages
      ansible.builtin.package_facts:

    - name: Check that the packages of all groups are installed
      ansible.builtin.assert:
        that: missing | length == 0
        fail_msg: "Packages not installed: {{ missing }}"
      vars:
        missing: "{{ expected_packages | reject('in', ansible_facts.packages) | list }}"

    - name: Read the users
      ansible.builtin.getent:
        database: passwd

    - name: Check that the users of all groups exist
      ansible.builtin.assert:
        that: missing | length == 0
        fail_msg: "Users not created: {{ missing }}"
      vars:
        missing: "{{ expected_users | reject('in', ansible_facts.getent_passwd) | list }}"

    - name: Read the repositories
      ansible.builtin.command: "{{ repo_check[ansible_facts.pkg_mgr].command }}"
      register: repolist
      changed_when: false

    - name: Check that the PgVillage and PGDG repositories are enabled
      ansible.builtin.assert:
        that: item in repolist.stdout
        fail_msg: "Repository {{ item }} is not enabled"
      loop: "{{ repo_check[ansible_facts.pkg_mgr].expect }}"

    - name: Read the service states
      ansible.builtin.service_facts:

    - name: Check that sysstat runs and is enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['sysstat.service'].state in ['running', 'stopped']
          - ansible_facts.services['sysstat.service'].status == 'enabled'
