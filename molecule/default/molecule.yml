---
# Tests the role on Rocky Linux 8 and 9 in systemd containers. The hosts are members of the hacluster, backup and
# router groups, so the packages and users of all of these groups are installed. prepare.yml runs the role's
# bootstrap, which installs a newer Python on Rocky 8 (its /usr/bin/python3 is 3.6).
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
driver:
  name: podman
platforms:
  - name: linux-el8
    image: docker.io/geerlingguy/docker-rockylinux8-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    groups:
      - hacluster
      - backup
      - router
  - name: linux-el9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    groups:
      - hacluster
      - backup
      - router
provisioner:
  name: ansible
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
