---
# defaults file for generic linux role for postgres servers
#
# Several variables below (linux_users, linux_groups, linux_packages) are hashes keyed by inventory group name.
# The custom `bygroup` filter (see filter_plugins/core.py) flattens such a hash into a single (deduplicated) list,
# containing only the items of the groups the current host is a member of (group_names).

# The primary PostgreSQL version (kept for backwards compatibility and for roles that need a single version)
linux_pg_version: "17"
# All PostgreSQL versions to install side by side (e.g. ["16", "17"] during a major upgrade)
linux_pg_versions:
  - "{{ linux_pg_version }}"

# OS users to create, per inventory group.
# Every item is passed as-is to ansible.builtin.user, so any option of that module (uid, shell, home, ...) can be set.
linux_users:
  hacluster:
    - name: postgres
      shell: /bin/bash
      system: true
#      uid: 26
    - name: pgbouncer
      shell: /bin/bash
      system: true
    - name: avchecker
      system: true
    - name: pgquartz
      system: true
    - name: pgfga
      system: true
    - name: pgroute66
      system: true
  backup:
    - name: minio
      system: true
  router:
    - name: haproxy
      system: true
    - name: keepalived
      system: true
    - name: pgroute66
      system: true

# OS groups to create, per inventory group. Groups are created before users.
# Every item is passed as-is to ansible.builtin.group, so any option of that module (gid, system, ...) can be set.
linux_groups:
  hacluster:
    - name: postgres
      system: true
#      gid: 26
  backup:
    - name: minio
      system: true
  router:
    - name: pgroute66
      system: true

# Debian style architecture name (amd64 / arm64) of the host, derived from ansible_facts.architecture
# using the linux_architectures mapping in vars/main.yml. Used in the apt repository definitions.
linux_architecture: "{{ linux_architectures[ansible_facts.architecture] }}"

# State of the packages to install: `present` (default) or `latest`.
# When set to `latest`, all packages on the system are upgraded as well.
linux_package_state: present

# Packages to install, per inventory group.
# By default this is the `default` set of _linux_packages, merged with the set for the package manager of the host
# (apt, dnf or zypper). Note that the merge replaces lists: if a package manager defines a list for a group,
# that list is used instead of the default list for that group.
linux_packages: >-
  {{
    _linux_packages.default
    | combine(_linux_packages[ansible_facts.pkg_mgr], recursive=True, list_merge='append')
    | combine(
        {'hacluster': _linux_pg_packages[ansible_facts.pkg_mgr]
                      | default(_linux_pg_packages.default)
                      | pg_versioned(linux_pg_versions)},
        recursive=True, list_merge='append')
  }}

# Internal: package lists per package manager (default, apt, dnf, zypper) and per inventory group.
# Installed once for every version in linux_pg_versions.
# '{version}' is replaced by the version (e.g. 9.6) and '{short}' by the version without dots (e.g. 96)
# Used to derive linux_packages. Override linux_packages rather than this variable.
_linux_pg_packages:
  default:
    - "postgresql{short}"
    - "postgresql{short}-server"
    - "postgresql{short}-contrib"
    - "postgresql{short}-devel"
    - "postgresql{short}-plpython3"
  apt:
    - "postgresql-{version}"

_linux_packages:
  default:
    hacluster:
      - "stolon"
      - "wal-g-pg"
      - "etcd"

    backup:
      - "minio"

    router:
      - keepalived
      - haproxy
      - pgroute66

    localhosts:
      - "chainsmith"

  # Package manager specific packages are appended to the default packages
  apt:
    hacluster:
      - "acl"
    backup:
      - "acl"

  dnf:
    hacluster:
      - glibc-all-langpacks
      - langpacks-en

  zypper:
    hacluster:
      - glibc-locale
      - glibc-locale-base
      - openssl

# Package repositories to configure, selected from _linux_public_repos by the package manager of the host.
# Items are passed as-is to ansible.builtin.yum_repository (dnf) or community.general.zypper_repository (zypper).
# For apt only the `repo` field is used (prefixed with `deb `) by ansible.builtin.apt_repository.
linux_public_repos: >-
  {{
    _linux_public_repos[ansible_facts.pkg_mgr]
    + (_linux_pg_repos[ansible_facts.pkg_mgr] | default([]) | pg_versioned(linux_pg_versions))
  }}

# Version specific PostgreSQL repositories, added once for every version in linux_pg_versions.
# '{version}' is replaced by the version (e.g. 17)
# apt has no entry, because apt.postgresql.org serves all versions from one repository.
_linux_pg_repos:
  dnf:
    - name: "pgdg{version}"
      description: "PostgreSQL {version} for RHEL / Rocky $releasever - $basearch"
      baseurl: "https://download.postgresql.org/pub/repos/yum/{version}/redhat/rhel-$releasever-$basearch"
      enabled: true
      gpgcheck: true
      gpgkey: "{{ linux_gpg_keys.dnf[ansible_facts.architecture] }}"
      # repo_gpgcheck: yes
      file: "pgdg-redhat-all"
  zypper:
    - name: "pgdg{version}"
      description: "PostgreSQL {version} for openSUSE Leap"
      repo: >-
        https://download.postgresql.org/pub/repos/zypp/{version}/opensuse/leap-{{
        ansible_facts.distribution_version }}-{{
        ansible_facts.architecture }}/
      enabled: true
      priority: 20

# Internal: repository definitions per package manager (dnf, zypper, apt): the PgVillage repository and the
# PostgreSQL PGDG repositories (plus EPEL for dnf). Override linux_public_repos rather than this variable.
_linux_public_repos:
  dnf:
    - name: PgVillage
      description: PgVillage RPM Library - RHEL $releasever - $basearch
      baseurl: https://repo.mannemsolutions.nl/yum/pgvillage/latest/el$releasever/$basearch
      gpgkey: https://repo.mannemsolutions.nl/yum/pgvillage/gpg_pubkey.asc
      gpgcheck: true
      file: pgvillage
    - name: "pgdg-common"
      description: PostgreSQL common RPMs for RHEL / Rocky $releasever - $basearch
      baseurl: https://download.postgresql.org/pub/repos/yum/common/redhat/rhel-$releasever-$basearch
      enabled: true
      gpgcheck: true
      gpgkey: "{{ linux_gpg_keys.dnf[ansible_facts.architecture] }}"
      # repo_gpgcheck: yes
      file: "pgdg-redhat-all"
      exclude: etcd
    - name: "pgdg-rhel-extras"
      description: Extra packages to support some RPMs in the PostgreSQL RPM repo RHEL / Rocky $releasever - $basearch
      baseurl: https://download.postgresql.org/pub/repos/yum/extras/redhat/rhel-$releasever-$basearch/
      enabled: true
      gpgcheck: true
      gpgkey: "{{ linux_gpg_keys.dnf[ansible_facts.architecture] }}"
      # repo_gpgcheck: yes
      file: "pgdg-redhat-all"
      exclude: "etcd*"
    - name: "epel"
      description: "Extra Packages for Enterprise Linux {{ ansible_facts.distribution_major_version }} - $basearch"
      metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel-9&arch=$basearch&infra=$infra&content=$contentdir"
      enabled: true
      gpgcheck: "yes"
      gpgkey: "{{ linux_gpg_keys.dnf.epel }}"
      # repo_gpgcheck: yes
      file: "epel"
  zypper:
    - name: PgVillage
      description: PgVillage RPM Library - RHEL $releasever - $basearch
      repo: https://repo.mannemsolutions.nl/zypp/latest/{{ ansible_facts.distribution_major_version }}/$basearch
      priority: 10
      disable_gpg_check: true
    - name: "pgdg-common"
      description: PostgreSQL common RPMs for RHEL / Rocky $releasever - $basearch
      repo: https://download.postgresql.org/pub/repos/zypp/common/opensuse/leap-{{ ansible_facts.distribution_version }}-{{ ansible_facts.architecture }}/
      enabled: true
      priority: 20
    - name: "pgdg-rhel-extras"
      description: Extra packages to support some RPMs in the PostgreSQL RPM repo RHEL / Rocky $releasever - $basearch
      repo: https://download.postgresql.org/pub/repos/zypp/extras/opensuse/leap-{{ ansible_facts.distribution_version }}-{{ ansible_facts.architecture }}/
      enabled: true
      priority: 20
  apt:
    - name: PgVillage
      description: "PgVillage DEB Library - Ubuntu {{ ansible_facts.distribution_version }} - {{ ansible_facts.architecture }}"
      repo: >-
        [signed-by=/etc/apt/keyrings/pgvillage.asc arch={{ linux_architecture }}]
        https://repo.mannemsolutions.nl/apt/latest
        {{ ansible_facts.distribution_release }}
        main
      priority: 10
    - name: "pgdg"
      description: "PostgreSQL for Ubuntu {{ ansible_facts.distribution_version }} - {{ ansible_facts.architecture }}"
      repo: |
        [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_facts.distribution_release }}-pgdg main
      enabled: true
      priority: 20

# Disable GPG signature checking when installing packages (dnf and zypper only).
linux_disable_gpg_check: "false"

# GPG keys per package manager:
# - dnf: PGDG keys per architecture (as reported by ansible_facts.architecture) and the EPEL key,
#   referenced by the dnf repositories in _linux_public_repos
# - zypper: PGDG keys per SLES version, referenced by linux_zypper_gpg_keys
# - apt: all keys are downloaded to /etc/apt/keyrings/<key>.asc and referenced with signed-by in the apt repositories
linux_gpg_keys:
  dnf:
    x86_64: https://download.postgresql.org/pub/repos/yum/keys/PGDG-RPM-GPG-KEY-RHEL
    aarch64: https://download.postgresql.org/pub/repos/yum/keys/PGDG-RPM-GPG-KEY-AARCH64-RHEL
    # aarch64: "https://download.postgresql.org/pub/repos/yum/keys/RPM-GPG-KEY-PGDG-AARCH64-RHEL$releasever"
    epel: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts.distribution_major_version }}"
  zypper:
    sles15: https://download.postgresql.org/pub/repos/zypp/keys/PGDG-RPM-GPG-KEY-SLES15
    sles16: https://download.postgresql.org/pub/repos/zypp/keys/PGDG-RPM-GPG-KEY-SLES16
  apt:
    postgresql: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    pgvillage: https://repo.mannemsolutions.nl/apt/pgvillage.asc

# List of GPG keys (urls or paths) to import into the rpm keyring on zypper based systems.
linux_zypper_gpg_keys:
  - "{{ linux_gpg_keys.zypper.sles16 }}"

# Red Hat subscription (Satellite) configuration for dnf based systems.
# When set, the system is registered with community.general.redhat_subscription using activationkey, org_id
# and pool_ids, linux_rh_misc_repo is configured (if set) and subscriptions are (auto-)attached.
# Leave empty ({}) to skip Red Hat subscription management.
linux_rh_subscription: {}
#  activationkey: "ORG1"
#  org_id: "ORG1"
#  pool_ids: []
#  state: present

# Additional (Satellite hosted) yum repository to configure when linux_rh_subscription is set.
# All keys in the example below are required. Leave empty ({}) to skip.
linux_rh_misc_repo: {}
#  name: "Rhel_Misc"
#  description: "Rhel Misc repository"
#  baseurl: "http://satellite.example.org/pulp/content/ORG1/Library/custom/rhel_misc/rhel_misc/"
#  enabled: "true"
#  gpgcheck: "true"
#  gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
#  sslverify: "true"
#  sslcacert: /etc/rhsm/ca/katello-server-ca.pem
#  sslclientkey: /etc/pki/entitlement/8675925567367701300-key.pem
#  sslclientcert: /etc/pki/entitlement/8675925567367701300.pem
#  priority: "20"

# By enabling linux_poor_mans_dns, PgVillage will add an entry (ip, fqdn and hostname) to /etc/hosts
# for all hosts in the inventory, except the hosts in the `localhosts` group.
# Note that the task is delegated to localhost, so the entries are added to /etc/hosts on the Ansible controller.
linux_poor_mans_dns: false
