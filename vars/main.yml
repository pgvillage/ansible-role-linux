---
# vars file for generic linux role for postgres servers

linux_architectures:
  aarch64: arm64
  x86_64: amd64

# Options of the modules that the role passes items of linux_groups, linux_users and linux_public_repos to.
# The tasks set each of these options from the item (when present); items with other keys make the role fail.
# Keep in sync with tasks/users.yml, tasks/packages-dnf.yml and tasks/packages-zypper.yml.
_linux_module_options:
  group:
    - force
    - gid
    - gid_max
    - gid_min
    - local
    - name
    - non_unique
    - state
    - system
  user:
    - append
    - comment
    - create_home
    - expires
    - force
    - generate_ssh_key
    - group
    - groups
    - home
    - local
    - move_home
    - name
    - non_unique
    - password
    - password_expire_account_disable
    - password_expire_max
    - password_expire_min
    - password_expire_warn
    - password_lock
    - remove
    - seuser
    - shell
    - skeleton
    - ssh_key_bits
    - ssh_key_comment
    - ssh_key_file
    - ssh_key_passphrase
    - ssh_key_type
    - state
    - system
    - uid
    - uid_max
    - uid_min
    - umask
    - update_password
  yum_repository:
    - baseurl
    - cost
    - description
    - enabled
    - exclude
    - file
    - gpgcakey
    - gpgcheck
    - gpgkey
    - includepkgs
    - metadata_expire
    - metalink
    - mirrorlist
    - module_hotfixes
    - name
    - password
    - priority
    - proxy
    - proxy_password
    - proxy_username
    - repo_gpgcheck
    - skip_if_unavailable
    - sslcacert
    - sslclientcert
    - sslclientkey
    - sslverify
    - state
    - timeout
    - username
  zypper_repository:
    - auto_import_keys
    - autorefresh
    - description
    - disable_gpg_check
    - enabled
    - name
    - overwrite_multiple
    - priority
    - repo
    - runrefresh
    - state
