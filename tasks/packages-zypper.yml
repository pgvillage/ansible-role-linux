---
- name: Check the repository options
  ansible.builtin.assert:
    that: unsupported | length == 0
    fail_msg: "Unsupported zypper_repository options for {{ item.name }}: {{ unsupported }}"
    quiet: true
  loop: "{{ linux_public_repos }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    unsupported: "{{ item.keys() | difference(_linux_module_options.zypper_repository) }}"

- name: Add repository
  community.general.zypper_repository:
    auto_import_keys: "{{ item.auto_import_keys | default(omit) }}"
    autorefresh: "{{ item.autorefresh | default(omit) }}"
    description: "{{ item.description | default(omit) }}"
    disable_gpg_check: "{{ item.disable_gpg_check | default(omit) }}"
    enabled: "{{ item.enabled | default(omit) }}"
    name: "{{ item.name }}"
    overwrite_multiple: "{{ item.overwrite_multiple | default(omit) }}"
    priority: "{{ item.priority | default(omit) }}"
    repo: "{{ item.repo | default(omit) }}"
    runrefresh: "{{ item.runrefresh | default(omit) }}"
    state: "{{ item.state | default(omit) }}"
  loop: "{{ linux_public_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Import PostgreSQL GPG key
  ansible.builtin.rpm_key:
    state: present
    key: "{{ item }}"
  loop: "{{ linux_zypper_gpg_keys }}"

- name: Upgrade all packages
  ansible.builtin.package:
    name: "*"
    state: "{{ linux_package_state }}"
  when: linux_package_state == 'latest'
  async: 600
  poll: 5

- name: Install packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: "{{ linux_package_state }}"
    update_cache: "true"
    disable_gpg_check: "{{ linux_disable_gpg_check }}"
  loop: "{{ linux_packages | bygroup(group_names) }}"
