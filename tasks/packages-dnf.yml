---
- name: Red Hat Satellite configuration
  when: linux_rh_subscription | length > 0
  block:
    - name: Enable the Postgresql RHSM subscriptions
      community.general.redhat_subscription:
        activationkey: "{{ linux_rh_subscription.activationkey }}"
        org_id: "{{ linux_rh_subscription.org_id }}"
        pool_ids: "{{ linux_rh_subscription.pool_ids }}"
        state: present

    - name: Enable rhel_misc repo
      ansible.builtin.yum_repository:
        name: "{{ linux_rh_misc_repo.name }}"
        description: "{{ linux_rh_misc_repo.description }}"
        baseurl: "{{ linux_rh_misc_repo.baseurl }}"
        enabled: "{{ linux_rh_misc_repo.enabled }}"
        gpgcheck: "{{ linux_rh_misc_repo.gpgcheck }}"
        gpgkey: "{{ linux_rh_misc_repo.gpgkey }}"
        sslverify: "{{ linux_rh_misc_repo.sslverify }}"
        sslcacert: "{{ linux_rh_misc_repo.sslcacert }}"
        sslclientkey: "{{ linux_rh_misc_repo.sslclientkey }}"
        sslclientcert: "{{ linux_rh_misc_repo.sslclientcert }}"
        priority: "{{ linux_rh_misc_repo.priority }}"
      when: linux_rh_misc_repo | length > 0
    - name: Autoattach
      ansible.builtin.command: "subscription-manager auto-attach"
      changed_when: false
    - name: Attach
      ansible.builtin.command: "subscription-manager attach"
      changed_when: false

- name: Check the repository options
  ansible.builtin.assert:
    that: unsupported | length == 0
    fail_msg: "Unsupported yum_repository options for {{ item.name }}: {{ unsupported }}"
    quiet: true
  loop: "{{ linux_public_repos }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    unsupported: "{{ item.keys() | difference(_linux_module_options.yum_repository) }}"

- name: Add repository
  ansible.builtin.yum_repository:
    baseurl: "{{ item.baseurl | default(omit) }}"
    cost: "{{ item.cost | default(omit) }}"
    description: "{{ item.description | default(omit) }}"
    enabled: "{{ item.enabled | default(omit) }}"
    exclude: "{{ item.exclude | default(omit) }}"
    file: "{{ item.file | default(omit) }}"
    gpgcakey: "{{ item.gpgcakey | default(omit) }}"
    gpgcheck: "{{ item.gpgcheck | default(omit) }}"
    gpgkey: "{{ item.gpgkey | default(omit) }}"
    includepkgs: "{{ item.includepkgs | default(omit) }}"
    metadata_expire: "{{ item.metadata_expire | default(omit) }}"
    metalink: "{{ item.metalink | default(omit) }}"
    mirrorlist: "{{ item.mirrorlist | default(omit) }}"
    module_hotfixes: "{{ item.module_hotfixes | default(omit) }}"
    name: "{{ item.name }}"
    password: "{{ item.password | default(omit) }}"
    priority: "{{ item.priority | default(omit) }}"
    proxy: "{{ item.proxy | default(omit) }}"
    proxy_password: "{{ item.proxy_password | default(omit) }}"
    proxy_username: "{{ item.proxy_username | default(omit) }}"
    repo_gpgcheck: "{{ item.repo_gpgcheck | default(omit) }}"
    skip_if_unavailable: "{{ item.skip_if_unavailable | default(omit) }}"
    sslcacert: "{{ item.sslcacert | default(omit) }}"
    sslclientcert: "{{ item.sslclientcert | default(omit) }}"
    sslclientkey: "{{ item.sslclientkey | default(omit) }}"
    sslverify: "{{ item.sslverify | default(omit) }}"
    state: "{{ item.state | default(omit) }}"
    timeout: "{{ item.timeout | default(omit) }}"
    username: "{{ item.username | default(omit) }}"
  loop: "{{ linux_public_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enable the CRB repository
  community.general.dnf_config_manager:
    name: "{{ linux_dnf_crb_repo }}"
    state: enabled
  when: linux_dnf_crb_repo | length > 0

# This should be dnf package, but it hangs
- name: Upgrade all packages
  ansible.builtin.package:
    name: "*"
    state: "{{ linux_package_state }}"
  when: linux_package_state == 'latest'
  async: 600
  poll: 5

- name: Check if postgresql module exists
  ansible.builtin.command: dnf module list
  register: dnf_module_list
  changed_when: false
  check_mode: false

- name: Disable postgresql module
  ansible.builtin.command: dnf module disable -y postgresql
  when: "'postgresql' in dnf_module_list.stdout"
  changed_when: false
- name: Install packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: "{{ linux_package_state }}"
    update_cache: "true"
    disable_gpg_check: "{{ linux_disable_gpg_check }}"
  loop: "{{ linux_packages | bygroup(group_names) }}"
